services:
  master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Lauta
    ports:
      - "3306:3306"
    volumes:
      - ./master/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./master/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mysql-net

  slave1:
    image: mysql:8.0
    container_name: mysql-slave1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Lauta
    ports:
      - "3307:3306"
    volumes:
      - ./slave1/my.cnf:/etc/mysql/conf.d/my.cnf
    depends_on:
      - master
    networks:
      - mysql-net

  slave2:
    image: mysql:8.0
    container_name: mysql-slave2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Lauta
    ports:
      - "3308:3306"
    volumes:
      - ./slave2/my.cnf:/etc/mysql/conf.d/my.cnf
    depends_on:
      - master
    networks:
      - mysql-net
      
  setup:
    image: mysql:8.0
    depends_on:
      - master
      - slave1
      - slave2
    volumes:
      - ./setup/setup-replication.sh:/setup.sh:ro
    entrypoint: ["bash", "/setup.sh"]
    networks:
      - mysql-net

networks:
  mysql-net: